<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Global RC Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  
  <!-- Social Share / Open Graph Meta Tags -->
  <meta property="og:title" content="RC Car Live! 🚗💨">
  <meta property="og:description" content="Take the wheel! Drive my RC car live directly from your browser.">
  <meta property="og:image" content="https://rc-car-relay-46cd.onrender.com/banner.jpg">
  <meta property="og:url" content="https://rc-car-relay-46cd.onrender.com">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: rgba(255, 255, 255, 0.7);
      --border: rgba(0, 0, 0, 0.1);
      --text: #1d1d1f;
      --subtext: #86868b;
      --shadow: rgba(0, 0, 0, 0.08);
      
      --panel-bg: rgba(255, 255, 255, 0.8);
      --btn-bg: rgba(255, 255, 255, 0.9);
      --btn-shadow: 0 4px 12px rgba(0,0,0,0.06);
    }
    
    [data-theme="dark"] {
      --bg: #000000;
      --surface: rgba(30, 30, 30, 0.6);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f5f5f7;
      --subtext: #a1a1a6;
      --shadow: rgba(0, 0, 0, 0.4);
      
      --panel-bg: rgba(20, 20, 20, 0.6);
      --btn-bg: rgba(40, 40, 40, 0.8);
      --btn-shadow: 0 4px 12px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Top Bar */
    .top-bar {
      width: 100%; max-width: 1200px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    
    .header-info { display: flex; flex-direction: column; }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin: 0 0 4px; color: var(--text); }
    #status-bar { font-size: 13px; font-weight: 500; color: var(--subtext); display: flex; align-items: center; gap: 6px; }
    
    #ws-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; transition: background 0.4s; }
    #ws-dot.connected { background: #34c759; }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 18px;
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.15s ease;
    }
    .theme-toggle:active { transform: scale(0.9); }

    .spinner {
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      width: 24px; height: 24px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Layout Grid */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      width: 100%;
      max-width: 1200px;
    }
    .center-col { order: 1; }
    .left-col { order: 2; }
    .right-col { order: 3; }

    @media (min-width: 900px) {
      .dashboard {
        grid-template-columns: 320px 1fr 320px;
        align-items: start;
      }
      .center-col { order: 2; }
      .left-col { order: 1; }
      .right-col { order: 3; }
    }

    /* Panels */
    .panel-container {
      display: flex; flex-direction: column; gap: 20px;
    }
    
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 30px var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--subtext); margin: 0 0 4px 4px; }
    
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
    }

    .btn {
      padding: 12px 10px; border-radius: 14px; border: 1px solid var(--border); background: var(--btn-bg);
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
      box-shadow: var(--btn-shadow);
      cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; white-space: nowrap;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:active { transform: scale(0.93); box-shadow: 0 1px 4px var(--shadow); }
    
    .btn.active-mode { background: rgba(0,122,255,0.12); color: #007aff; border-color: rgba(0,122,255,0.2); }
    .btn-red   { background: rgba(255,59,48,0.1);  color: #ff3b30; }
    .btn-amber { background: rgba(255,149,0,0.1);  color: #ff9500; }
    .btn-green { background: rgba(52,199,89,0.1);  color: #34c759; }
    .btn-purple{ background: rgba(175,82,222,0.1); color: #af52de; }
    .btn-teal  { background: rgba(90,200,250,0.12); color: #32ade6; }

    /* Joystick Area */
    .center-col {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 0;
    }

    #zone_joystick {
      position: relative; width: 280px; height: 280px;
      background: var(--surface); border-radius: 50%;
      box-shadow: 0 20px 50px var(--shadow), inset 0 2px 4px rgba(255,255,255,0.1);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      touch-action: none; flex-shrink: 0;
    }
    #stick {
      position: absolute; width: 90px; height: 90px;
      background: linear-gradient(145deg, #ffffff, #e8e8ec);
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.1), inset 0 -3px 6px rgba(0,0,0,0.05);
      pointer-events: none;
    }
    [data-theme="dark"] #stick {
       background: linear-gradient(145deg, #3a3a3c, #1c1c1e);
       box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.1);
    }

    #active-mode-label { font-size: 14px; font-weight: 700; color: var(--accent); margin-top: 24px; text-align: center; letter-spacing: 0.5px;}

    /* Keyboard HUD */
    .kb-hud {
      margin-top: 18px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .kb-row { display: flex; gap: 6px; justify-content: center; }
    .kb-key {
      min-width: 36px; height: 36px;
      background: var(--btn-bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--subtext);
      box-shadow: 0 3px 0 var(--border);
      transition: background 0.1s, box-shadow 0.1s, transform 0.1s;
      user-select: none; padding: 0 8px;
    }
    .kb-key.active {
      background: rgba(0,122,255,0.15);
      color: #007aff;
      border-color: rgba(0,122,255,0.4);
      box-shadow: 0 1px 0 rgba(0,122,255,0.3);
      transform: translateY(2px);
    }
    .kb-hint { font-size: 11px; color: var(--subtext); margin-top: 4px; text-align: center; }
    
    /* Offline overlay */
    #offline-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg); opacity: 0.95;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; text-align: center;
      transition: opacity 0.5s;
    }
    #offline-overlay h2 { margin: 0; color: var(--text); font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    #offline-overlay p { margin: 12px 0 0; color: var(--subtext); font-weight: 500; font-size: 16px; max-width: 300px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="header-info">
      <h1>🌐 RC Control</h1>
      <div id="status-bar">
        <div id="ws-dot"></div>
        <span id="ws-label">Connecting...</span>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
  </div>
  
  <div id="offline-overlay">
    <h2>Car is Offline 🚗💤</h2>
    <p>Waiting for the car to connect to the cloud...</p>
    <div style="margin-top:24px" id="ws-dot" class=""></div>
  </div>

  <div class="dashboard">
    <!-- LEFT COLUMN -->
    <div class="left-col panel-container">
      <div class="panel">
        <div class="section-title">⚡ Stunts</div>
        <div class="btn-grid">
          <button class="btn" onclick="doDonut()">🍩 Donut</button>
          <button class="btn" onclick="doZigZag()">⚡ Zig-Zag</button>
          <button class="btn" onclick="doJTurn()">🌪️ J-Turn</button>
          <button class="btn" onclick="doBurnout()">🔥 Burnout</button>
          <button class="btn" onclick="doRocketStart()">🚀 Launch</button>
          <button class="btn" onclick="doFigure8()">8️⃣ Figure 8</button>
        </div>
        <button class="btn btn-red" style="margin-top:4px;" onclick="stopAll()">🛑 Stop Driving</button>
      </div>
      
      <div class="panel">
        <div class="section-title">🎭 Combo Effects</div>
        <div class="btn-grid">
          <button class="btn btn-purple" onclick="doPoliceChase()">🚓 Police Chase</button>
          <button class="btn btn-amber" onclick="doGhostMode()">👻 Ghost Mode</button>
          <button class="btn btn-green" onclick="doRaceMode()">🏁 Race Mode</button>
          <button class="btn btn-teal"  onclick="doPartyMode()">🎉 Party Mode</button>
          <button class="btn btn-red"   onclick="doSOSMode()">🆘 SOS Rescue</button>
        </div>
        <button class="btn btn-red" style="margin-top:4px;" onclick="stopCombo()">❌ Stop Combo</button>
      </div>
    </div>

    <!-- CENTER COLUMN -->
    <div class="center-col">
      <div id="zone_joystick"><div id="stick"></div></div>
      <div id="active-mode-label">Mode: Normal</div>

      <!-- Keyboard HUD -->
      <div class="kb-hud">
        <div class="kb-row">
          <div class="kb-key" id="kU">↑ W</div>
        </div>
        <div class="kb-row">
          <div class="kb-key" id="kA">← A</div>
          <div class="kb-key" id="kS">↓ S</div>
          <div class="kb-key" id="kR">→ D</div>
        </div>
        <div class="kb-row" style="margin-top:4px;">
          <div class="kb-key" id="kSP" style="min-width:130px;">SPACE — Lights</div>
        </div>
        <div class="kb-hint">🎮 L = Police · B = Strobe · N = Lights Off</div>
        <button id="mouse-lock-btn" class="btn btn-teal" style="margin-top:10px; width:100%;" onclick="toggleMouseLock()">🖱️ Enable Mouse Control</button>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-col panel-container">
      <div class="panel">
        <div class="section-title">💡 Lights</div>
        <div class="btn-grid">
          <button class="btn" onclick="setLight('on')">💡 On</button>
          <button class="btn" onclick="setLight('blink')">⚠️ Blink</button>
          <button class="btn" onclick="setLight('fastblink')">🔆 Fast Blink</button>
          <button class="btn" onclick="setLight('strobe')">⚡ Strobe</button>
          <button class="btn" onclick="setLight('police')">🚓 Police</button>
          <button class="btn" onclick="setLight('sos')">🆘 SOS</button>
          <button class="btn" onclick="setLight('heartbeat')">❤️ Heartbeat</button>
          <button class="btn" onclick="setLight('candle')">🕯️ Candle</button>
          <button class="btn" onclick="setLight('racestart')">🏁 Race Start</button>
        </div>
        <button class="btn" style="margin-top:4px;" onclick="setLight('off')">🌑 Lights Off</button>
      </div>
    </div>
  </div>

  <script>
    // ---- Theme Toggle Logic ----
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      document.getElementById('theme-btn').textContent = newTheme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', newTheme);
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    }

    // Dynamically connect to the same host serving this page
    const RELAY_URL = 'wss://' + window.location.host;
    
    let ws, wsReady = false, reconnectTimer;
    const wsDot = document.getElementById('ws-dot');
    const wsLabel = document.getElementById('ws-label');
    const modeLabel = document.getElementById('active-mode-label');
    const offlineOverlay = document.getElementById('offline-overlay');

    let carOnline = false;

    // Check car status via HTTP API
    async function checkCarStatus() {
        try {
            const httpUrl = RELAY_URL.replace('wss://', 'https://');
            const res = await fetch(httpUrl);
            const data = await res.json();
            carOnline = (data.status === 'online');
            
            if (carOnline && wsReady) {
                offlineOverlay.style.opacity = '0';
                setTimeout(() => offlineOverlay.style.display = 'none', 500);
            } else {
                offlineOverlay.style.display = 'flex';
                offlineOverlay.style.opacity = '1';
                if (!wsReady) {
                    offlineOverlay.querySelector('p').textContent = 'Connecting to Cloud Relay...';
                } else {
                    offlineOverlay.querySelector('p').textContent = 'Relay connected, waiting for car...';
                }
            }
        } catch(e) {}
    }
    setInterval(checkCarStatus, 3000);

    function connectWS() {
      ws = new WebSocket(RELAY_URL + '/driver');
      ws.onopen  = () => { wsReady = true; wsDot.classList.add('connected'); wsLabel.textContent = 'Connected'; clearTimeout(reconnectTimer); checkCarStatus(); };
      ws.onclose = () => { wsReady = false; wsDot.classList.remove('connected'); wsLabel.textContent = 'Reconnecting...'; reconnectTimer = setTimeout(connectWS, 2000); };
      ws.onerror = () => ws.close();
    }
    connectWS();

    // Send commands via WS
    function sendCmd(cmd) { if (wsReady && ws.readyState === WebSocket.OPEN) ws.send(cmd); }
    function setLight(mode) { sendCmd('LIGHT:' + mode); }

    // ---- Joystick ----
    const zone  = document.getElementById('zone_joystick');
    const stick = document.getElementById('stick');
    const maxDiff = 85; // Increased stick travel distance
    let dragging = false, lastDrive = 99, lastSteer = 99;

    function sendDrive(drive, steer) {
      if (drive === lastDrive && steer === lastSteer) return;
      lastDrive = drive; lastSteer = steer;
      sendCmd('DRIVE:' + drive + ',' + steer);
    }

    const handleStart = (e) => { dragging = true; comboRunning = false; handleMove(e); };
    const handleEnd   = () => { dragging = false; stick.style.transform = 'translate(0px,0px)'; stick.style.transition = 'transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275)'; sendDrive(0,0); };
    const handleMove  = (e) => {
      if (!dragging) return;
      e.preventDefault();
      stick.style.transition = 'none';
      const touch = e.targetTouches ? e.targetTouches[0] : e;
      const rect  = zone.getBoundingClientRect();
      let dx = touch.clientX - (rect.left + rect.width / 2);
      let dy = touch.clientY - (rect.top  + rect.height / 2);
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > maxDiff) { dx = dx/dist*maxDiff; dy = dy/dist*maxDiff; }
      stick.style.transform = `translate(${dx}px,${dy}px)`;
      sendDrive(dy < -25 ? 1 : dy > 25 ? -1 : 0, dx > 25 ? 1 : dx < -25 ? -1 : 0);
    };
    zone.addEventListener('mousedown', (e) => {
      if (mouseLocked) {
        if (e.button === 0) {
          lightsOn = !lightsOn;
          setLight(lightsOn ? 'on' : 'off');
        }
        return;
      }
      if (e.button !== 0) return;
      handleStart(e);
    });
    document.addEventListener('contextmenu', (e) => {
      if (mouseLocked) {
        e.preventDefault();
        document.exitPointerLock();
      }
    });
    document.addEventListener('mouseup', (e) => {
      if (!mouseLocked) handleEnd();
    });
    document.addEventListener('mousemove', (e) => {
      if (!mouseLocked) handleMove(e);
    });
    zone.addEventListener('touchstart', handleStart, {passive: false});
    document.addEventListener('touchend', handleEnd, {passive: false});
    document.addEventListener('touchmove', handleMove, {passive: false});

    // ---- Pointer Lock / Mouse Control ----
    let mouseLocked = false;
    let mlX = 0, mlY = 0; // accumulated offset from center
    const ML_MAX = maxDiff;
    const mlBtn = document.getElementById('mouse-lock-btn');

    function toggleMouseLock() {
      if (!mouseLocked) {
        if (!confirm('Enable Mouse Control?\n\nYour cursor will be hidden and locked. Move your mouse to steer — the joystick stays where you leave it.\n\nPress ESC to exit mouse control.')) return;
        zone.requestPointerLock();
      } else {
        document.exitPointerLock();
      }
    }

    document.addEventListener('pointerlockchange', () => {
      mouseLocked = document.pointerLockElement === zone;
      if (mouseLocked) {
        mlX = 0; mlY = 0;
        mlBtn.textContent = '🖱️ Exit Mouse Control';
        mlBtn.classList.add('active-mode');
        mlBtn.classList.remove('btn-teal');
      } else {
        // release: snap joystick back, stop car
        mlX = 0; mlY = 0;
        stick.style.transition = 'transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275)';
        stick.style.transform = 'translate(0px,0px)';
        sendDrive(0, 0);
        mlBtn.textContent = '🖱️ Enable Mouse Control';
        mlBtn.classList.remove('active-mode');
        mlBtn.classList.add('btn-teal');
      }
    });

    document.addEventListener('mousemove', e => {
      if (!mouseLocked) return;
      // Accumulate movement
      mlX += e.movementX;
      mlY += e.movementY;
      // Clamp to circle
      const dist = Math.sqrt(mlX*mlX + mlY*mlY);
      if (dist > ML_MAX) { mlX = mlX/dist*ML_MAX; mlY = mlY/dist*ML_MAX; }
      // Update stick visual
      stick.style.transition = 'none';
      stick.style.transform = `translate(${mlX}px,${mlY}px)`;
      // Send drive command based on position
      sendDrive(mlY < -28 ? 1 : mlY > 28 ? -1 : 0, mlX > 28 ? 1 : mlX < -28 ? -1 : 0);
    });


    // ---- Keyboard Controls ----
    const keysDown = new Set();
    let kbDrive = 0, kbSteer = 0;
    let lightsOn = false;

    const kMap = {
      'w':'kW','arrowup':'kU',
      's':'kS','arrowdown':'kD',
      'a':'kA','arrowleft':'kL',
      'd':'kR','arrowright':'kRR'
    };

    function kbUpdate() {
      const up   = keysDown.has('w') || keysDown.has('arrowup');
      const down = keysDown.has('s') || keysDown.has('arrowdown');
      const left = keysDown.has('a') || keysDown.has('arrowleft');
      const right= keysDown.has('d') || keysDown.has('arrowright');
      const newDrive = up ? 1 : down ? -1 : 0;
      const newSteer = right ? 1 : left ? -1 : 0;
      if (newDrive !== kbDrive || newSteer !== kbSteer) {
        kbDrive = newDrive; kbSteer = newSteer;
        sendDrive(kbDrive, kbSteer);
        // Animate joystick stick to show KB input
        stick.style.transition = 'none';
        stick.style.transform = `translate(${newSteer * 55}px,${newDrive * -55}px)`;
        if (newDrive === 0 && newSteer === 0) {
          stick.style.transition = 'transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275)';
          stick.style.transform = 'translate(0px,0px)';
        }
      }
      // Update visual key highlights
      const ids = {w:'kW',arrowup:'kU',s:'kS',arrowdown:'kD',a:'kA',arrowleft:'kL',d:'kR',arrowright:'kRR'};
      Object.entries(ids).forEach(([k,id]) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('active', keysDown.has(k));
      });
      const spEl = document.getElementById('kSP');
      if (spEl) spEl.classList.toggle('active', keysDown.has(' '));
    }

    document.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) {
        e.preventDefault();
      }
      if (!keysDown.has(k)) {
        keysDown.add(k);
        if (k === ' ') {
          lightsOn = !lightsOn;
          setLight(lightsOn ? 'on' : 'off');
          document.getElementById('kSP').classList.toggle('active', true);
          setTimeout(() => document.getElementById('kSP').classList.toggle('active', false), 200);
        }
        if (k === 'l') { setLight('police'); }
        if (k === 'b') { setLight('strobe'); }
        if (k === 'n') { setLight('off'); lightsOn = false; }
        kbUpdate();
      }
    });
    document.addEventListener('keyup', e => {
      keysDown.delete(e.key.toLowerCase());
      kbUpdate();
    });

    // ---- Helpers ----
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    let comboRunning = false;

    function stopAll()   { comboRunning = false; kbDrive = 0; kbSteer = 0; sendDrive(0,0); modeLabel.textContent = 'Mode: Stopped'; }
    function stopCombo() { comboRunning = false; kbDrive = 0; kbSteer = 0; sendDrive(0,0); setLight('off'); modeLabel.textContent = 'Mode: Normal'; }

    // ============ STUNTS ============
    async function doDonut() {
      comboRunning = false; modeLabel.textContent = 'Mode: Donut 🍩';
      sendDrive(1, 1); await sleep(3000); sendDrive(0, 0);
      modeLabel.textContent = 'Mode: Normal';
    }
    async function doZigZag() {
      comboRunning = false; modeLabel.textContent = 'Mode: Zig-Zag ⚡';
      for (let i = 0; i < 4; i++) {
        sendDrive(1, 1);  await sleep(350);
        sendDrive(1, -1); await sleep(350);
      }
      sendDrive(0, 0); modeLabel.textContent = 'Mode: Normal';
    }
    async function doJTurn() {
      comboRunning = false; modeLabel.textContent = 'Mode: J-Turn 🌪️';
      sendDrive(-1, 0); await sleep(700);
      sendDrive(-1, 1); await sleep(450);
      sendDrive(1, -1); await sleep(700);
      sendDrive(0, 0);  modeLabel.textContent = 'Mode: Normal';
    }
    async function doBurnout() {
      comboRunning = false; modeLabel.textContent = 'Mode: Burnout 🔥';
      setLight('strobe');
      sendDrive(1, 0); await sleep(2500);
      sendDrive(0, 0); setLight('off'); modeLabel.textContent = 'Mode: Normal';
    }
    async function doRocketStart() {
      comboRunning = false; modeLabel.textContent = 'Mode: Launch 🚀';
      setLight('racestart');
      await sleep(2000);
      sendDrive(1, 0); await sleep(2000);
      sendDrive(0, 0); setLight('off'); modeLabel.textContent = 'Mode: Normal';
    }
    async function doFigure8() {
      comboRunning = false; modeLabel.textContent = 'Mode: Figure 8 8️⃣';
      for (let i = 0; i < 2; i++) {
        sendDrive(1, 1);  await sleep(1200);
        sendDrive(1, -1); await sleep(1200);
      }
      sendDrive(0, 0); modeLabel.textContent = 'Mode: Normal';
    }

    // ============ COMBO EFFECTS ============
    async function doPoliceChase() {
      comboRunning = true; modeLabel.textContent = 'Mode: Police Chase 🚓';
      setLight('police');
      while (comboRunning) {
        sendDrive(1, 0);  await sleep(600);
        sendDrive(1, 1);  await sleep(400);
        sendDrive(1, 0);  await sleep(600);
        sendDrive(1, -1); await sleep(400);
      }
      sendDrive(0, 0); setLight('off');
    }
    async function doGhostMode() {
      comboRunning = true; modeLabel.textContent = 'Mode: Ghost Mode 👻';
      setLight('candle');
      while (comboRunning) {
        sendDrive(1, 0);   await sleep(800 + Math.random()*600);
        sendDrive(0, 0);   await sleep(300 + Math.random()*500);
        sendDrive(-1, 0);  await sleep(300 + Math.random()*400);
        sendDrive(1, Math.random() > 0.5 ? 1 : -1); await sleep(500);
      }
      sendDrive(0, 0); setLight('off');
    }
    async function doRaceMode() {
      comboRunning = true; modeLabel.textContent = 'Mode: Race Mode 🏁';
      setLight('strobe');
      while (comboRunning) {
        sendDrive(1, 0);  await sleep(1000);
        sendDrive(1, 1);  await sleep(300);
        sendDrive(1, 0);  await sleep(1000);
        sendDrive(1, -1); await sleep(300);
      }
      sendDrive(0, 0); setLight('off');
    }
    async function doPartyMode() {
      comboRunning = true; modeLabel.textContent = 'Mode: Party Mode 🎉';
      const lights = ['strobe','police','heartbeat','blink','fastblink'];
      let li = 0;
      while (comboRunning) {
        setLight(lights[li % lights.length]); li++;
        const d = Math.random() > 0.5 ? 1 : -1;
        const s = [-1, 0, 1][Math.floor(Math.random()*3)];
        sendDrive(d, s);
        await sleep(400 + Math.random()*600);
      }
      sendDrive(0, 0); setLight('off');
    }
    async function doSOSMode() {
      comboRunning = true; modeLabel.textContent = 'Mode: SOS Rescue 🆘';
      setLight('sos');
      while (comboRunning) {
        sendDrive(1, 0);  await sleep(500);
        sendDrive(0, 0);  await sleep(300);
        sendDrive(1, 1);  await sleep(400);
        sendDrive(0, 0);  await sleep(300);
        sendDrive(1, -1); await sleep(400);
        sendDrive(0, 0);  await sleep(600);
      }
      sendDrive(0, 0); setLight('off');
    }
  </script>
</body>
